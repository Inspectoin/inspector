name: Deploy to TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_PATH=$RUNNER_TEMP/main_profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > $PROFILE_PATH

          DECODED_PLIST=$RUNNER_TEMP/profile_decoded.plist
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$DECODED_PLIST"

          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$DECODED_PLIST")
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$DECODED_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${MAIN_UUID}.mobileprovision

          echo "MAIN_PROFILE_UUID=$MAIN_UUID" >> $GITHUB_ENV
          echo "MAIN_PROFILE_NAME=$MAIN_NAME" >> $GITHUB_ENV

      - name: Configure manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e "s/DEVELOPMENT_TEAM = 66RB22TU4G;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' \
            -e "s|PROVISIONING_PROFILE_SPECIFIER = \"\";|PROVISIONING_PROFILE_SPECIFIER = \"${MAIN_PROFILE_NAME}\";|g" \
            "$PROJECT"

          perl -i -pe '
            if (/LastSwiftMigration = 1100;/) {
              $_ .= "\t\t\t\t\t\tProvisioningStyle = Manual;\n";
            }
          ' "$PROJECT"

      - name: Prepare ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s|TEAM_ID_PLACEHOLDER|$APPLE_TEAM_ID|g" ios/ExportOptions.plist
          sed -i '' "s|MAIN_PROFILE_PLACEHOLDER|$MAIN_PROFILE_NAME|g" ios/ExportOptions.plist

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Upload attempt $attempt of $MAX_ATTEMPTS..."
            OUTPUT=$(xcrun altool --upload-app \
              --type ios \
              -f build/ios/ipa/*.ipa \
              --apiKey $APP_STORE_CONNECT_API_KEY_ID \
              --apiIssuer $APP_STORE_CONNECT_ISSUER_ID 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "No errors uploading"; then
              echo "Upload succeeded!"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Upload failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "Upload failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -f $RUNNER_TEMP/main_profile.mobileprovision
          rm -rf ~/.private_keys
